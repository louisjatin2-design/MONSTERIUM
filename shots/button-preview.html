<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MONSTERIUM — Button-Vorschau</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
  body {
    background: linear-gradient(180deg, #7cc8ea 0%, #5ab4e0 55%, #3f8db8 100%);
    min-height: 100vh; color: #fff; padding: 24px;
  }
  h1 { font-size: 22px; text-shadow: 0 2px 6px rgba(0,0,0,.5); margin-bottom: 4px; }
  .sub { opacity: .85; margin-bottom: 24px; font-size: 13px; }
  .row { display: flex; gap: 48px; flex-wrap: wrap; margin-bottom: 32px; }
  .box { background: rgba(0,0,0,.18); border: 1px solid rgba(255,255,255,.25);
         border-radius: 14px; padding: 20px; }
  .box h2 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase;
            margin-bottom: 16px; opacity: .9; }
  .cluster { display: flex; gap: 12px; align-items: flex-end; }

  /* ── OLD: image squeezed inside a gold frame ── */
  .old-btn { width: 74px; background: linear-gradient(160deg,#ff5a4a,#c41f1f);
             border: 2.5px solid #ffb070; border-radius: 17px; padding: 9px 0 7px;
             display: flex; flex-direction: column; align-items: center; gap: 2px;
             box-shadow: 0 4px 14px rgba(255,90,60,.55), inset 0 1px 0 rgba(255,255,255,.3); }
  .old-btn img { width: 40px; height: 40px; object-fit: contain;
                 filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
  .old-btn span { font-size: 11px; font-weight: 900; text-shadow: 0 1px 2px rgba(0,0,0,.85); }

  /* ── NEW: the artwork IS the button (circle-cropped) ── */
  .emblem-btn { background: transparent; border: none; padding: 0; cursor: pointer;
                display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .emblem-disc { position: relative; width: 84px; height: 84px; border-radius: 50%;
                 overflow: hidden; transition: transform .12s;
                 box-shadow: 0 5px 16px rgba(0,0,0,.6), 0 0 14px -2px var(--glow,#ffb070),
                             inset 0 0 0 1.5px rgba(255,255,255,.14); }
  .emblem-btn:hover .emblem-disc { transform: translateY(-1px) scale(1.05); }
  .emblem-btn:active .emblem-disc { transform: translateY(2px) scale(.95); }
  .emblem-disc img { position: absolute; inset: -5%; width: 110%; height: 110%; object-fit: cover; }
  .emblem-disc .sheen { position: absolute; inset: 0; border-radius: 50%;
       background: radial-gradient(120% 70% at 50% -10%, rgba(255,255,255,.30), transparent 55%); }
  .emblem-btn .lbl { font-size: 11px; font-weight: 900; letter-spacing: .04em;
       text-shadow: 0 1px 3px rgba(0,0,0,.9);
       background: linear-gradient(180deg, rgba(10,12,20,.82), rgba(10,12,20,.6));
       border: 1px solid rgba(255,255,255,.16); border-radius: 999px; padding: 1.5px 8px; }
  .sm .emblem-disc { width: 56px; height: 56px; }
  .sm .lbl { font-size: 8.5px; }

  @keyframes emblemPulse {
    0%,100%{ box-shadow:0 5px 16px rgba(0,0,0,.6),0 0 14px -2px rgba(255,90,60,.55),inset 0 0 0 1.5px rgba(255,255,255,.14);}
    50%{ box-shadow:0 6px 22px rgba(0,0,0,.6),0 0 26px 2px rgba(255,120,60,.95),inset 0 0 0 1.5px rgba(255,255,255,.2);}
  }
  .primary .emblem-disc { animation: emblemPulse 1.8s ease-in-out infinite; }
</style>
</head>
<body>
  <h1>MONSTERIUM — UI-Buttons</h1>
  <div class="sub">Vorher: das Bild als Mini-Icon im goldenen Rahmen. Nachher: das Bild <b>ist</b> der Button.</div>

  <div class="row">
    <div class="box">
      <h2>❌ Vorher</h2>
      <div class="cluster">
        <button class="old-btn"><img src="../src/assets/ui/icons/kaempfen.png"><span>KÄMPFEN</span></button>
        <button class="old-btn"><img src="../src/assets/ui/icons/laden.png"><span>LADEN</span></button>
      </div>
    </div>

    <div class="box">
      <h2>✅ Nachher</h2>
      <div class="cluster">
        <button class="emblem-btn primary" style="--glow:#ffb070">
          <span class="emblem-disc"><img src="../src/assets/ui/icons/kaempfen.png"><span class="sheen"></span></span>
          <span class="lbl">KÄMPFEN</span>
        </button>
        <button class="emblem-btn sm" style="--glow:#ffe090">
          <span class="emblem-disc"><img src="../src/assets/ui/icons/laden.png"><span class="sheen"></span></span>
          <span class="lbl">LADEN</span>
        </button>
      </div>
    </div>
  </div>

  <div class="box" style="display:inline-block">
    <h2>Alle Embleme</h2>
    <div class="cluster">
      <button class="emblem-btn sm"><span class="emblem-disc"><img src="../src/assets/ui/icons/lager.png"><span class="sheen"></span></span><span class="lbl">LAGER</span></button>
      <button class="emblem-btn sm"><span class="emblem-disc"><img src="../src/assets/ui/icons/quests.png"><span class="sheen"></span></span><span class="lbl">QUESTS</span></button>
      <button class="emblem-btn sm"><span class="emblem-disc"><img src="../src/assets/ui/icons/pass.png"><span class="sheen"></span></span><span class="lbl">PASS</span></button>
      <button class="emblem-btn sm"><span class="emblem-disc"><img src="../src/assets/ui/icons/monster.png"><span class="sheen"></span></span><span class="lbl">MONSTER</span></button>
    </div>
  </div>
</body>
</html>
